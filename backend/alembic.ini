# Alembic config for developer CLI use, run from the backend/ directory:
#   .venv\Scripts\alembic revision --autogenerate -m "what changed"
#   .venv\Scripts\alembic upgrade head
#
# The database URL is NOT set here on purpose: alembic/env.py reads it from
# app.config settings so there is one source of truth. At runtime the app runs
# migrations programmatically (see app/database.py), not through this file.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
